<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Card & Registration Form</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <button id="themeToggle">Toggle Dark / Light</button>

  <!-- Product Card -->
  <section class="card">
    <img src="images/product.jpg" alt="Product Image" onerror="this.style.display='none'; document.getElementById('imgError').style.display='block';">
    <p id="imgError">Image not available</p>

    <h2>Fresh Apples</h2>
    <p>High quality fresh apples directly from farms.</p>
    <h3>$4.99</h3>

    <button id="cartBtn">Add to Cart</button>
    <p id="cartMsg"></p>
  </section>

  <!-- Registration Form -->
  <section class="form-section">
    <h2>User Registration</h2>

    <form id="registerForm">

      <label>Full Name</label>
      <input type="text" id="name">
      <small class="error" id="nameError"></small>

      <label>Email</label>
      <input type="email" id="email">
      <small class="error" id="emailError"></small>

      <label>Password</label>
      <div class="password-box">
        <input type="password" id="password">
        <button type="button" class="toggle" onclick="togglePassword('password')">Show</button>
      </div>
      <small class="error" id="passwordError"></small>

      <label>Confirm Password</label>
      <div class="password-box">
        <input type="password" id="confirmPassword">
        <button type="button" class="toggle" onclick="togglePassword('confirmPassword')">Show</button>
      </div>
      <small class="error" id="confirmError"></small>

      <button type="submit">Register</button>
      <p id="successMsg"></p>

    </form>
  </section>

  <script src="js/script.js"></script>
</body>
</html>
